<div class="card">
    <div class="font-semibold text-xl mb-4">Equipment Classes</div>

    <p-toolbar class="mb-6">
        <ng-template #start>
            <p-button label="Add" icon="pi pi-plus" class="mr-2" (onClick)="showEquipmentClassDialog()" />
            <p-button label="Delete" icon="pi pi-trash" severity="danger" (onClick)="deleteSelected()" [disabled]="!selectedEquipmentClasses || !selectedEquipmentClasses.length" />
        </ng-template>
        <ng-template #end>
            <p-button label="Export" icon="pi pi-download" severity="secondary" (onClick)="exportCSV()" />
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="equipmentClasses()" [paginator]="true" [rows]="10" [globalFilterFields]="['name', 'description']" [(selection)]="selectedEquipmentClasses" [scrollable]="true" scrollHeight="600px" dataKey="id" class="custom-align-table">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <h5 class="m-0">Manage Equipment Clases</h5>
                <p-iconfield>
                    <p-inputicon class="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search Equipment Clases..." />
                </p-iconfield>
            </div>
        </ng-template>

        <ng-template #header>
            <tr>
                <th style="width: 3rem">
                    <p-tableHeaderCheckbox />
                </th>
                <th style="width: 35%" pSortableColumn="name">Name <p-sortIcon field="name" /></th>
                <th style="width: 15%" pSortableColumn="description">Description <p-sortIcon field="description" /></th>
                <th style="width: 20%">Actions</th>
            </tr>
        </ng-template>

        <ng-template #body let-equipmentClass>
            <tr>
                <td>
                    <p-tableCheckbox [value]="equipmentClass" />
                </td>
                <td style="width: 35%">
                    <div class="flex items-center gap-3 truncate">
                        <span class="sku-text font-bold"> {{ equipmentClass.name }} </span>
                        <span class="text-secondary text-sm"> {{ equipmentClass.description }} </span>
                    </div>
                </td>
                <td style="width: 20%">
                    <div class="flex gap-1">
                        <p-button icon="pi pi-eye" [rounded]="true" [text]="true" severity="info" [routerLink]="['/resource-management/resource-execution/equipment-classes', equipmentClass.id]" pTooltip="View Details" />
                        <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="warn" (onClick)="showEquipmentClassDialog(equipmentClass)" pTooltip="Edit Version" />
                        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="openDeleteDialog(equipmentClass)" pTooltip="Delete Version" />
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template #emptymessage>
            <tr>
                <td colspan="5">No process segments found.</td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-confirmdialog />
<p-toast />
